<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 856" width="880" height="856" role="img" aria-label="Inference pipeline: video to results.json">
  <title>Roadside driver-behaviour analytics — inference pipeline</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f6f8fa;
      --card2: #ffffff;
      --border: #d0d7de;
      --dash: #afb8c1;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #0969da;
      --violet: #8250df;
      --green: #1a7f37;
      --orange: #bc4c00;
      --line: #6e7781;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --card2: #0d1117;
        --border: #30363d;
        --dash: #484f58;
        --text: #e6edf3;
        --muted: #9198a1;
        --accent: #58a6ff;
        --violet: #bc8cff;
        --green: #3fb950;
        --orange: #db6d28;
        --line: #8b949e;
      }
    }
    .bg    { fill: var(--bg); }
    .card  { fill: var(--card); stroke: var(--border); stroke-width: 1.25; }
    .card2 { fill: var(--card2); stroke: var(--border); stroke-width: 1.25; }
    .grp   { fill: none; stroke: var(--dash); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h     { font-size: 14.5px; font-weight: 600; fill: var(--text); }
    .s     { font-size: 11.5px; fill: var(--muted); }
    .lbl   { font-size: 11px; font-weight: 600; fill: var(--muted); letter-spacing: .06em; }
    .foot  { font-size: 11.5px; font-style: italic; fill: var(--muted); }
    .ln    { stroke: var(--line); stroke-width: 1.5; fill: none; }
    .ar    { fill: var(--line); }
    .kA    { fill: var(--accent); }
    .kV    { fill: var(--violet); }
    .kG    { fill: var(--green); }
    .kO    { fill: var(--orange); }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="ar"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="856"/>

  <!-- 1. input -->
  <rect class="card2" x="290" y="20" width="300" height="56" rx="8"/>
  <rect class="kA" x="290" y="20" width="4" height="56" rx="2"/>
  <text class="t h" x="308" y="45">Roadside camera video</text>
  <text class="t s" x="308" y="64">night · through the windshield · single pass</text>
  <path class="ln" d="M 440 76 L 440 108" marker-end="url(#a)"/>

  <!-- 2. normalization -->
  <rect class="card" x="250" y="110" width="380" height="60" rx="8"/>
  <text class="t h" x="268" y="135">Normalization layer</text>
  <text class="t s" x="268" y="154">CLAHE (clip 3.0, 8×8) + gamma 1.2 · adaptive frame stride</text>
  <path class="ln" d="M 440 170 L 440 202" marker-end="url(#a)"/>

  <!-- 3. detect + track -->
  <rect class="card" x="250" y="204" width="380" height="60" rx="8"/>
  <text class="t h" x="268" y="229">Vehicle detection + tracking</text>
  <text class="t s" x="268" y="248">YOLO11 · imgsz 1280 · COCO classes 2 / 3 / 5 / 7</text>
  <path class="ln" d="M 440 264 L 440 296" marker-end="url(#a)"/>

  <!-- 4. gate -->
  <rect class="card" x="250" y="298" width="380" height="60" rx="8"/>
  <text class="t h" x="268" y="323">Main-vehicle gate</text>
  <text class="t s" x="268" y="342">box height ≥ 0.18·H · largest accumulated track area</text>
  <path class="ln" d="M 440 358 L 440 392" marker-end="url(#a)"/>

  <!-- 5. parallel heads -->
  <rect class="grp" x="16" y="394" width="848" height="216" rx="10"/>
  <text class="t lbl" x="32" y="416">PARALLEL EVIDENCE HEADS — SAMPLED PER TRACKED FRAME</text>

  <rect class="card" x="32" y="428" width="264" height="76" rx="7"/>
  <rect class="kA" x="32" y="428" width="4" height="76" rx="2"/>
  <text class="t h" x="48" y="452">Licence plate (ALPR)</text>
  <text class="t s" x="48" y="470">plate_yolo11s.pt → EasyOCR</text>
  <text class="t s" x="48" y="487">vote-lock: ≥6 reads, mean conf ≥ 0.70</text>

  <rect class="card" x="308" y="428" width="264" height="76" rx="7"/>
  <rect class="kA" x="308" y="428" width="4" height="76" rx="2"/>
  <text class="t h" x="324" y="452">Body type</text>
  <text class="t s" x="324" y="470">tip.pt (YOLO-cls)</text>
  <text class="t s" x="324" y="487">CLAHE-equalised crop preserves silhouette</text>

  <rect class="card" x="584" y="428" width="264" height="76" rx="7"/>
  <rect class="kA" x="584" y="428" width="4" height="76" rx="2"/>
  <text class="t h" x="600" y="452">Colour</text>
  <text class="t s" x="600" y="470">renk.pt (YOLO-cls)</text>
  <text class="t s" x="600" y="487">HSV classifier as fallback</text>

  <rect class="card" x="32" y="518" width="264" height="76" rx="7"/>
  <rect class="kV" x="32" y="518" width="4" height="76" rx="2"/>
  <text class="t h" x="48" y="542">Driver action</text>
  <text class="t s" x="48" y="560">yolo11n-pose.pt</text>
  <text class="t s" x="48" y="577">hand–face geometry, not a raw classifier</text>

  <rect class="card" x="308" y="518" width="264" height="76" rx="7"/>
  <rect class="kV" x="308" y="518" width="4" height="76" rx="2"/>
  <text class="t h" x="324" y="542">Passengers &amp; cabin objects</text>
  <text class="t s" x="324" y="560">seat-region occupancy · teknocan.pt</text>
  <text class="t s" x="324" y="577">aspect-ratio + dashboard-region guards</text>

  <rect class="card" x="584" y="518" width="264" height="76" rx="7"/>
  <rect class="kV" x="584" y="518" width="4" height="76" rx="2"/>
  <text class="t h" x="600" y="542">Slalom (trajectory)</text>
  <text class="t s" x="600" y="560">degree-2 detrend of lateral centre</text>
  <text class="t s" x="600" y="577">RMS ≥ 0.070 vehicle-widths, ≥3 turns</text>

  <path class="ln" d="M 440 610 L 440 644" marker-end="url(#a)"/>

  <!-- 6. aggregation -->
  <rect class="card" x="120" y="646" width="640" height="112" rx="8"/>
  <rect class="kG" x="120" y="646" width="4" height="112" rx="2"/>
  <text class="t h" x="140" y="672">Evidence aggregation</text>
  <text class="t s" x="140" y="694">Arbitration — mutually exclusive hand–face actions (phone / cigarette / drinking): only the dominant one survives</text>
  <text class="t s" x="140" y="713">Temporal debounce — consecutive same-label runs collapse into a single peak-confidence event</text>
  <text class="t s" x="140" y="732">Confidence-weighted voting across the whole video, plus minimum frame-count and ratio thresholds</text>
  <path class="ln" d="M 440 758 L 440 790" marker-end="url(#a)"/>

  <!-- 7. output -->
  <rect class="card2" x="290" y="792" width="300" height="56" rx="8"/>
  <rect class="kO" x="290" y="792" width="4" height="56" rx="2"/>
  <text class="t h" x="308" y="817">results.json</text>
  <text class="t s" x="308" y="836">arac_bilgisi + tespitler — always written</text>
</svg>
