<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Precision, recall and F1 by detection category">
  <title>Detection quality by category — precision, recall, F1</title>
  <desc>Driver action: precision 1.00, recall 1.00, F1 1.00 (TP 3, FP 0, FN 0). Cabin objects: precision 1.00, recall 0.50, F1 0.67 (TP 1, FP 0, FN 1). Passengers: precision 1.00, recall 0.33, F1 0.50 (TP 1, FP 0, FN 2). Overall: precision 1.00, recall 0.62, F1 0.77 (TP 5, FP 0, FN 3).</desc>
  <style>
    :root {
      --surface: #ffffff;
      --ink:     #0b0b0b;
      --ink2:    #52514e;
      --muted:   #898781;
      --grid:    #e1e0d9;
      --axis:    #c3c2b7;
      --s1:      #2a78d6;
      --s2:      #eb6834;
      --s3:      #1baf7a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0d1117;
        --ink:     #ffffff;
        --ink2:    #c3c2b7;
        --muted:   #898781;
        --grid:    #2c2c2a;
        --axis:    #383835;
        --s1:      #3987e5;
        --s2:      #d95926;
        --s3:      #199e70;
      }
    }
    .surface { fill: var(--surface); }
    .t    { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cat  { font-size: 13px; font-weight: 600; fill: var(--ink); }
    .cnt  { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
    .val  { font-size: 11.5px; font-weight: 600; fill: var(--ink2); font-variant-numeric: tabular-nums; }
    .tick { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
    .leg  { font-size: 12px; fill: var(--ink2); }
    .note { font-size: 11px; fill: var(--muted); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--axis); stroke-width: 1.5; }
    .sep  { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 4; }
    .f1   { fill: var(--s1); }
    .f2   { fill: var(--s2); }
    .f3   { fill: var(--s3); }
  </style>

  <rect class="surface" x="0" y="0" width="880" height="470"/>

  <!-- legend -->
  <rect class="f1" x="196" y="20" width="11" height="11" rx="2"/>
  <text class="t leg" x="213" y="30">Precision</text>
  <rect class="f2" x="292" y="20" width="11" height="11" rx="2"/>
  <text class="t leg" x="309" y="30">Recall</text>
  <rect class="f3" x="370" y="20" width="11" height="11" rx="2"/>
  <text class="t leg" x="387" y="30">F1</text>

  <!-- gridlines -->
  <line class="grid" x1="348.5" y1="56" x2="348.5" y2="382"/>
  <line class="grid" x1="501"   y1="56" x2="501"   y2="382"/>
  <line class="grid" x1="653.5" y1="56" x2="653.5" y2="382"/>
  <line class="grid" x1="806"   y1="56" x2="806"   y2="382"/>
  <line class="axis" x1="196" y1="56" x2="196" y2="382"/>

  <!-- x ticks -->
  <text class="t tick" x="196"   y="400" text-anchor="middle">0</text>
  <text class="t tick" x="348.5" y="400" text-anchor="middle">0.25</text>
  <text class="t tick" x="501"   y="400" text-anchor="middle">0.50</text>
  <text class="t tick" x="653.5" y="400" text-anchor="middle">0.75</text>
  <text class="t tick" x="806"   y="400" text-anchor="middle">1.00</text>

  <!-- G1 sofor_eylemi : P 1.00 R 1.00 F1 1.00 -->
  <text class="t cat" x="180" y="97"  text-anchor="end">Driver action</text>
  <text class="t cnt" x="180" y="113" text-anchor="end">TP 3 · FP 0 · FN 0</text>
  <path class="f1" d="M196 72 L802 72 A4 4 0 0 1 806 76 L806 86 A4 4 0 0 1 802 90 L196 90 Z"/>
  <path class="f2" d="M196 92 L802 92 A4 4 0 0 1 806 96 L806 106 A4 4 0 0 1 802 110 L196 110 Z"/>
  <path class="f3" d="M196 112 L802 112 A4 4 0 0 1 806 116 L806 126 A4 4 0 0 1 802 130 L196 130 Z"/>
  <text class="t val" x="814" y="85">1.00</text>
  <text class="t val" x="814" y="105">1.00</text>
  <text class="t val" x="814" y="125">1.00</text>

  <!-- G2 nesneler : P 1.00 R 0.50 F1 0.67 -->
  <text class="t cat" x="180" y="175" text-anchor="end">Cabin objects</text>
  <text class="t cnt" x="180" y="191" text-anchor="end">TP 1 · FP 0 · FN 1</text>
  <path class="f1" d="M196 150 L802 150 A4 4 0 0 1 806 154 L806 164 A4 4 0 0 1 802 168 L196 168 Z"/>
  <path class="f2" d="M196 170 L497 170 A4 4 0 0 1 501 174 L501 184 A4 4 0 0 1 497 188 L196 188 Z"/>
  <path class="f3" d="M196 190 L598.7 190 A4 4 0 0 1 602.7 194 L602.7 204 A4 4 0 0 1 598.7 208 L196 208 Z"/>
  <text class="t val" x="814" y="163">1.00</text>
  <text class="t val" x="509" y="183">0.50</text>
  <text class="t val" x="610.7" y="203">0.67</text>

  <!-- G3 yolcular : P 1.00 R 0.33 F1 0.50 -->
  <text class="t cat" x="180" y="253" text-anchor="end">Passengers</text>
  <text class="t cnt" x="180" y="269" text-anchor="end">TP 1 · FP 0 · FN 2</text>
  <path class="f1" d="M196 228 L802 228 A4 4 0 0 1 806 232 L806 242 A4 4 0 0 1 802 246 L196 246 Z"/>
  <path class="f2" d="M196 248 L395.3 248 A4 4 0 0 1 399.3 252 L399.3 262 A4 4 0 0 1 395.3 266 L196 266 Z"/>
  <path class="f3" d="M196 268 L497 268 A4 4 0 0 1 501 272 L501 282 A4 4 0 0 1 497 286 L196 286 Z"/>
  <text class="t val" x="814" y="241">1.00</text>
  <text class="t val" x="407.3" y="261">0.33</text>
  <text class="t val" x="509" y="281">0.50</text>

  <!-- separator -->
  <line class="sep" x1="60" y1="300" x2="806" y2="300"/>

  <!-- G4 TOPLAM : P 1.00 R 0.62 F1 0.77 -->
  <text class="t cat" x="180" y="339" text-anchor="end">Overall</text>
  <text class="t cnt" x="180" y="355" text-anchor="end">TP 5 · FP 0 · FN 3</text>
  <path class="f1" d="M196 314 L802 314 A4 4 0 0 1 806 318 L806 328 A4 4 0 0 1 802 332 L196 332 Z"/>
  <path class="f2" d="M196 334 L573.3 334 A4 4 0 0 1 577.3 338 L577.3 348 A4 4 0 0 1 573.3 352 L196 352 Z"/>
  <path class="f3" d="M196 354 L661.2 354 A4 4 0 0 1 665.2 358 L665.2 368 A4 4 0 0 1 661.2 372 L196 372 Z"/>
  <text class="t val" x="814" y="327">1.00</text>
  <text class="t val" x="585.3" y="347">0.62</text>
  <text class="t val" x="673.2" y="367">0.77</text>

  <!-- footnote -->
  <text class="t note" x="60" y="432">Measured on 3 example videos against manually verified reference labels (tools/ground_truth.json) — 8 ground-truth items in total.</text>
  <text class="t note" x="60" y="450">Precision is 1.00 in every category: the system produced zero false positives. Recall is the deliberate trade — see the design rule in the README.</text>
</svg>
